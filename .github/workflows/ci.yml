name: ci
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # package-lock.json をコミットしたら npm ci + setup-node の cache:npm に戻す
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
