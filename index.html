<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ugatsu — koyu の 2D/3D ビューア</title>
    <meta
      name="description"
      content="koyu (空間ファーストのテキスト記法) の 2D/3D ビューア。平面・積層・立体・面積表はすべてテキストから生成される。ブラウザで開いて、そのまま書き換えられる。"
    />
    <!-- 平面記号の一室 (左壁に開口) — 開口が部屋を使えるものにする、が名の由来 -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Cstyle%3Epath{stroke:%23171A18}@media(prefers-color-scheme:dark){path{stroke:%23EEF1ED}}%3C/style%3E%3Cpath d=%22M6 6H26M26 6V26M26 26H6M6 26V20M6 14V6%22 fill=%22none%22 stroke-width=%222.5%22/%3E%3C/svg%3E"
    />
    <!-- --paper (DSのトークン値。data URI / meta にはvarが効かないため直値) -->
    <meta name="theme-color" content="#F4F5F2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141715" media="(prefers-color-scheme: dark)" />
    <!-- デモサイト (https://ugatsu.dev) 用。配布HTMLでは参照されないだけで無害 -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <meta property="og:site_name" content="ugatsu" />
    <meta property="og:title" content="ugatsu — koyu の 2D/3D ビューア" />
    <meta
      property="og:description"
      content="テキストに座標は無い。平面・積層・立体・面積表は、書いた端から生成される。"
    />
    <meta property="og:url" content="https://ugatsu.dev/" />
    <meta property="og:image" content="https://ugatsu.dev/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- ダークテーマの初期フラッシュ防止 (本適用は src/lib/theme.ts) -->
    <script>
      try {
        var t = localStorage.getItem("ugatsu:theme");
        if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches))
          document.documentElement.dataset.theme = "dark";
      } catch (e) {}
    </script>
    <!-- embed-model.mjs がここに .muro ソースを注入する。空なら同梱の例が開く -->
    <script id="muro-embed" type="application/muro"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
